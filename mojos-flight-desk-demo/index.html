<div id="wpwrap"><div id="wpcontent"><div id="wpbody" role="main"><div id="wpbody-content"><div class="wrap">
<div id="mjd"><div style="padding:40px;text-align:center;color:#6B8690">Loading Flight Desk…</div></div>
</div></div></div></div></div>

<div class="mjd-demobar" role="note">
	<span class="mjd-demobar__dot"></span>
	<span class="mjd-demobar__txt"><b>Demo</b> · sample data only</span>
	<button type="button" class="mjd-demobar__reset" title="Put the sample data back the way it started">Reset</button>
</div>

<script>
/* Demo configuration — mirrors what WordPress hands the real Flight Desk, with sample values. */
try { localStorage.setItem('mjdAppHide', '1'); } catch (e) {}
window.MJD = {
	ajax: 'demo://flight-desk',
	nonce: 'demo',
	stages: { 'kiting': ['Kiting / Ground Work', '#40BEE2'], 'close-first': ['Close to First Flight', '#E8B54A'], 'flying': ['Flying — Building Hours', '#F89B66'], 'almost-done': ['Almost Finished', '#F1854E'], 'paused': ['On Hold', '#9AA9AE'] },
	categories: { intro: 'Intro Day', training: 'Premium Training', 'day-rate': 'Day Rate Training', conversion: 'Launch Conversion', gear: 'Gear', merch: 'Merch', other: 'Other' },
	methods: ['Cash', 'Check', 'Venmo', 'Zelle', 'PayPal', 'Card', 'Other'],
	bookUrl: '#demo-booking-page',
	logUrl: '#demo-attendance-form',
	links: { credentials: '#demo', pricing: [['APCO dealer sheet', '#demo'], ['Kangook dealer sheet', '#demo'], ['MacFly dealer sheet', '#demo']] },
	team: ['Alex', 'Jordan', 'Taylor', 'Casey'],
	hourCats: ['Gear / maintenance', 'Intros & student calls', 'Admin / office', 'Event / fly-in', 'Other'],

	orderCats: ['Wing', 'Motor', 'Trike / cart', 'Risers / harness', 'Reserve / safety', 'Parts', 'Other'],
	dealers: ['APCO', 'Kangook', 'MacFly', 'Gin'],
	locations: ['Maiden, NC', 'Mocksville, NC', 'Yadkinville, NC', 'Laurens, SC']
};
</script>
