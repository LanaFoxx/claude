<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0}
.pta-cs{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;font-family:'Red Hat Display',sans-serif;color:#04243F;background:#fff}
.pta-cs *{box-sizing:border-box}
.pta-cs-top{padding:12px clamp(16px,4vw,48px);display:flex;justify-content:center;border-bottom:1px solid #DCE5EC;background:#fff}
.pta-cs-logo{display:block;width:190px;height:50px;overflow:hidden}
.pta-cs-logo img{height:96px !important;width:auto !important;max-width:none !important;margin:-22px 0 0 -50px;mix-blend-mode:multiply}
.pta-cs-hero{flex:1;position:relative;overflow:hidden;isolation:isolate;background:#04243F;color:#fff;display:flex;align-items:center;justify-content:center;padding:clamp(56px,9vw,120px) clamp(16px,4vw,48px)}
.pta-cs-hero:before{content:"";position:absolute;inset:0;z-index:-1;background-image:repeating-radial-gradient(circle at 92% 8%,rgba(255,255,255,.03) 0 1px,transparent 1px 34px)}
.pta-cs-hero:after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse 40% 60% at 80% 30%,rgba(18,163,180,.22),transparent 70%),radial-gradient(ellipse 35% 55% at 95% 95%,rgba(251,90,53,.16),transparent 70%),radial-gradient(ellipse 38% 60% at 8% 15%,rgba(11,74,110,.75),transparent 70%),radial-gradient(ellipse 32% 50% at 2% 100%,rgba(251,90,53,.12),transparent 70%)}
.pta-cs-in{max-width:760px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px}
.pta-cs-mark{width:56px;height:auto}
.pta-cs-pill{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:8px 16px;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.pta-cs-pill i{width:8px;height:8px;border-radius:50%;background:#FB5A35;display:block}
.pta-cs h1{margin:0;font-size:clamp(36px,5.4vw,64px);font-weight:900;letter-spacing:-.03em;line-height:1.06;text-wrap:balance}
.pta-cs h1 span{display:block;font-weight:300}
.pta-cs p{margin:0;font-size:clamp(18px,1.7vw,21px);font-weight:300;line-height:1.55;max-width:620px;text-wrap:balance}
.pta-cs-btns{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:6px}
.pta-cs-btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 26px;border-radius:8px;font-weight:700;font-size:18px;text-decoration:none;white-space:nowrap;transition:background .2s,color .2s}
.pta-cs-btn.solid{background:#FB5A35;color:#fff}.pta-cs-btn.solid:hover{background:#C93C1A;color:#fff}
.pta-cs-btn.line{color:#fff;box-shadow:inset 0 0 0 2px #fff}.pta-cs-btn.line:hover{background:#fff;color:#04243F}
.pta-cs-hours{font-size:16px !important;opacity:.8}
.pta-cs-foot{padding:20px clamp(16px,4vw,48px);text-align:center;font-size:14px;color:#4A6076;background:#fff}
@media (max-width:560px){.pta-cs-btns{flex-direction:column;align-self:stretch}.pta-cs-btn{width:100%}}
</style>
<div class="pta-cs">
 <header class="pta-cs-top"><span class="pta-cs-logo"><img src="https://pacifictaxacademy.com/wp-content/uploads/2026/11/pta-logo.webp" alt="Pacific Tax Academy"></span></header>
 <main class="pta-cs-hero"><div class="pta-cs-in">
  <img class="pta-cs-mark" src="https://pacifictaxacademy.com/wp-content/uploads/2026/11/check-white-coral.svg" alt="">
  <span class="pta-cs-pill"><i></i>Coming soon</span>
  <h1>CTEC courses for California tax preparers<span>are almost here</span></h1>
  <p>We're putting the finishing touches on online courses for new and renewing CTEC preparers. Video, study guide and audio, all in one place.</p>
  <div class="pta-cs-btns"><a class="pta-cs-btn solid" href="tel:+18444434797">Call (844) 443-4797 ›</a><a class="pta-cs-btn line" href="mailto:info@pacifictaxacademy.com">Email us ›</a></div>
  <p class="pta-cs-hours">Mon–Fri, 9am–6pm PT</p>
 </div></main>
 <footer class="pta-cs-foot">© <span class="pta-cs-y">2026</span> Pacific Tax Academy</footer>
</div>
<script>document.querySelectorAll('.pta-cs-y').forEach(function(e){e.textContent=new Date().getFullYear()});</script>
