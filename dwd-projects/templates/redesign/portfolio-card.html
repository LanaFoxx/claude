<a data-platform="{{ p.platform_key }}" data-dw-card="1" class="dwh3" data-dw-reveal="1" href="{{ p.href }}" style="grid-column:span {{ p.span }};display:flex;flex-direction:column;gap:18px;text-decoration:none;color:#121212">
        <div style="position:relative;overflow:hidden;border-radius:8px;aspect-ratio:{{ p.ratio }};background:#EDEDED">
          <div style="position:absolute;inset:0"><img data-dw-zoom="1" src="{{ p.cover }}" alt="{{ p.alt }}" loading="lazy" style="width:100%;height:100%;object-fit:cover;object-position:top;display:block"></div>
          <img src="{{ p.phone }}" alt="" loading="lazy" style="position:absolute;right:5%;bottom:-2%;width:22%;height:auto;display:block;filter:drop-shadow(0 18px 30px rgba(0,0,0,.35))">
        </div>
        <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 24px;padding-top:6px">
          <div style="display:flex;flex-direction:column;gap:6px">
            <span style="font-size:clamp(22px,2vw,30px);font-weight:600;letter-spacing:-.02em;line-height:1.1">{{ p.name }}</span>
            <span style="font-size:15px;color:#6B6B6B"><span data-dw-num>{{ p.num }}</span> · {{ p.cat }} · {{ p.platform }}</span>
          </div>
          <span style="display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:inherit">View project <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12 12 2M4 2h8v8"></path></svg></span>
        </div>
      </a>
