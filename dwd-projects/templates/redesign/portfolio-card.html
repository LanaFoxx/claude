<a data-platform="{{ p.platform_key }}" data-dw-card="1" data-dw-reveal="1" href="{{ p.href }}" class="pf-row dwh3" style="display:grid;grid-template-columns:7fr 5fr;gap:clamp(28px,4vw,56px);align-items:center;padding:clamp(32px,4vw,48px) 0;text-decoration:none;color:#121212">
        <div class="pf-media" style="position:relative;padding:0 0 6% 0;order:{{ p.mediaOrder }}">
          <div style="position:relative;width:88%">
            <div style="background:#111214;border:1px solid #2A2D33;border-bottom:0;border-radius:14px 14px 0 0;padding:10px 10px 0">
              <div style="position:relative;aspect-ratio:16/10;overflow:hidden;border-radius:6px 6px 0 0;background:#1C1C1C"><img data-dw-zoom="1" src="{{ p.cover }}" alt="{{ p.alt }}" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;display:block"></div>
            </div>
            <div style="height:14px;background:linear-gradient(180deg,#E9EAED 0%,#C3C6CC 100%);border-radius:0 0 12px 12px;box-shadow:0 18px 40px rgba(18,18,18,.18)"></div>
          </div>
          <img src="{{ p.phone }}" alt="" loading="lazy" style="position:absolute;right:0;bottom:0;width:27%;height:auto;display:block;filter:drop-shadow(0 20px 36px rgba(18,18,18,.35))">
        </div>
        <div class="pf-copy" style="display:flex;flex-direction:column;gap:18px;order:{{ p.copyOrder }}">
          <span style="font-size:14px;font-weight:600;color:#13A6EE"><span data-dw-num>{{ p.num }}</span></span>
          <span style="font-size:clamp(32px,3.6vw,52px);font-weight:600;letter-spacing:-.035em;line-height:1;color:inherit">{{ p.name }}</span>
          <span style="font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6B6B6B">{{ p.cat }} · {{ p.platform }}</span>
          <span style="font-size:17px;line-height:1.5;color:#333;text-wrap:pretty;max-width:460px">{{ p.desc }}</span>
          <span style="display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:inherit;margin-top:6px">View project <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12 12 2M4 2h8v8"></path></svg></span>
        </div>
      </a>
