<section id="pf-hero" data-theme="dark" style="position:relative;isolation:isolate;overflow:hidden;background:#121212;color:#fff;padding:clamp(150px,22vh,240px) clamp(20px,4vw,56px) clamp(48px,6vw,88px)">
  <canvas id="dw-hero-canvas" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;-webkit-mask-image:radial-gradient(ellipse 60% 55% at 22% 30%,transparent 0%,rgba(0,0,0,.3) 45%,#000 80%);mask-image:radial-gradient(ellipse 60% 55% at 22% 30%,transparent 0%,rgba(0,0,0,.3) 45%,#000 80%)"></canvas>
  <span style="display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#13A6EE;margin-bottom:24px"><span style="width:24px;height:2px;background:#13A6EE;flex:0 0 auto"></span>My work</span>
  <h1 data-dw-reveal="1" data-dw-kind="lines" data-dw-intro="1" style="margin:0;font-size:clamp(44px,9vw,160px);line-height:.9;letter-spacing:-.045em;font-weight:600;color:#fff">
    <span style="display:block;overflow:hidden;padding-bottom:.08em;margin-bottom:-.08em"><span data-dw-line="1">Websites built</span></span>
    <span style="display:block;overflow:hidden;padding-bottom:.08em;margin-bottom:-.08em"><span data-dw-line="1" style="color:#13A6EE;transition-delay:.12s">for real businesses.</span></span>
  </h1>
  <div id="pf-head" data-dw-reveal="1" data-dw-intro="1" style="display:grid;grid-template-columns:1fr 1fr;gap:24px 48px;align-items:end;margin-top:clamp(32px,4vw,56px);transition-delay:.3s">
    <p style="margin:0;max-width:520px;font-size:clamp(17px,1.4vw,21px);line-height:1.45;color:#C9C9C9;text-wrap:pretty">Over the past 12 years I’ve built more than 200 websites. Below is a selection of recent favorites. Every one is live; click any project to view the full site.</p>
    <div id="pf-filter" style="display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px">
      <button type="button" data-filter="all" aria-pressed="{{ isAll }}" style="min-height:44px;padding:0 18px;border-radius:999px;border:1px solid {{ allBorder }};background:{{ allBg }};color:{{ allColor }};font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .3s ease,color .3s ease,border-color .3s ease">All <span style="color:inherit;opacity:.6">{{ countAll }}</span></button>
      <button type="button" data-filter="wordpress" aria-pressed="{{ isWP }}" style="min-height:44px;padding:0 18px;border-radius:999px;border:1px solid {{ wpBorder }};background:{{ wpBg }};color:{{ wpColor }};font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .3s ease,color .3s ease,border-color .3s ease">WordPress <span style="color:inherit;opacity:.6">{{ countWP }}</span></button>
      <button type="button" data-filter="webflow" aria-pressed="{{ isWF }}" style="min-height:44px;padding:0 18px;border-radius:999px;border:1px solid {{ wfBorder }};background:{{ wfBg }};color:{{ wfColor }};font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .3s ease,color .3s ease,border-color .3s ease">Webflow <span style="color:inherit;opacity:.6">{{ countWF }}</span></button>
    </div>
  </div>
</section>

<section data-theme="light" style="background:#fff;color:#121212;padding:clamp(64px,8vw,120px) clamp(20px,4vw,56px)">
  <div id="pf-grid" style="display:flex;flex-direction:column">
    {{{ cards }}}
    <div style="border-top:1px solid #121212"></div>
  </div>
</section>

<section id="pf-cta" data-theme="blue" style="background:#13A6EE;color:#121212;padding:clamp(72px,9vw,128px) clamp(20px,4vw,56px)">
  <div class="dw-cta-row" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:28px 48px">
    <h2 data-dw-reveal="1" data-dw-kind="lines" style="margin:0;font-size:clamp(34px,4.6vw,72px);line-height:1;letter-spacing:-.045em;font-weight:600;color:#fff;min-width:0">
      <span style="display:block;overflow:hidden;padding-bottom:.1em;margin-bottom:-.1em"><span data-dw-line="1" style="text-wrap:balance">Your site could be next.</span></span>
    </h2>
    <div data-dw-reveal="1" class="dw-cta-btns" style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;flex:0 0 auto;transition-delay:.15s">
      <a class="dwh12" href="%HOME%/quote/" style="display:inline-flex;align-items:center;gap:10px;min-height:58px;padding:0 28px;border-radius:999px;background:#121212;color:#fff;font-size:17px;font-weight:600;text-decoration:none;white-space:nowrap;transition:transform .3s ease">Get a Quote <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12 12 2M4 2h8v8"></path></svg></a>
      <a class="dwh13" href="tel:+17722101728" style="display:inline-flex;align-items:center;min-height:58px;padding:0 28px;border-radius:999px;border:2px solid #121212;color:#121212;font-size:17px;font-weight:600;text-decoration:none;white-space:nowrap;transition:background .3s ease,color .3s ease">Call (772) 210-1728</a>
    </div>
  </div>
</section>
