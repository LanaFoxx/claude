<a class="dwh3" data-dw-reveal="1" href="{{ p.href }}" style="grid-column:span {{ p.span }};display:flex;flex-direction:column;gap:18px;text-decoration:none;color:#121212">
        <div style="position:relative;overflow:hidden;border-radius:8px;aspect-ratio:16/9;background:#EDEDED">
          <img data-dw-zoom="1" src="{{ p.image }}" alt="" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block">
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;border-top:1px solid #121212;padding-top:16px">
          <span style="font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6B6B6B">{{ p.cat }} · {{ p.read }}</span>
          <span style="font-size:clamp(22px,2vw,32px);font-weight:600;letter-spacing:-.025em;line-height:1.1;color:inherit;text-wrap:balance">{{ p.title }}</span>
          <span style="font-size:16px;line-height:1.5;color:#333;text-wrap:pretty">{{ p.excerpt }}</span>
          <span style="display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:inherit;margin-top:4px">Read article <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12 12 2M4 2h8v8"></path></svg></span>
        </div>
      </a>
